name: Release

on:
  push:
    branches: [main]
  # Rebuilds the installers of an existing release (e.g. after deleting broken assets):
  #   gh workflow run release.yml -f tag=v0.1.2
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, e.g. v0.1.2"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Fully automatic: a push with releasable commits (feat, fix, ...) opens the release PR,
    # this job merges it right away and a second release-please run tags and publishes it.
    # A push with nothing releasable (docs, chore, ci) opens no PR and releases nothing.
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id || steps.publish.outputs.id }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The PR JSON is parsed in the shell: a fromJSON() in env fails on runs that open no PR.
      - name: Merge release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r .number)
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch

      # Only creates the tag and GitHub release for the PR merged above; never opens a new PR.
      - id: publish
        if: steps.release.outputs.pr != ''
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Decides what to build: the release just created by a push, or the tag given by hand.
  target:
    name: Target
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      release_id: ${{ steps.pick.outputs.release_id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ needs.release-please.outputs.release_created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          CREATED_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tag must look like v1.2.3" >&2
              exit 1
            fi
            id=$(gh api "repos/$REPO/releases/tags/$INPUT_TAG" --jq .id)
            { echo "build=true"; echo "tag=$INPUT_TAG"; echo "release_id=$id"; } >> "$GITHUB_OUTPUT"
          elif [ "$CREATED" = "true" ]; then
            { echo "build=true"; echo "tag=$CREATED_TAG"; echo "release_id=$CREATED_ID"; } >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: target
    # !cancelled() is needed: release-please is skipped on manual runs, and a skipped job up the
    # chain would otherwise skip this one too.
    if: ${{ !cancelled() && needs.target.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      # The release tag, not the pushed commit: the version bump lands in the release PR merged
      # after the push, so the pushed commit still carries the previous version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm fetch-sidecars --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload by release ID, not tagName: with tagName, tauri-action v1 rewrites the
          # existing release's name/body and would wipe the release-please changelog.
          releaseId: ${{ needs.target.outputs.release_id }}
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }}
